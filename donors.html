    <style>
        /* ============================================
           COMPLETE CSS FOR DONORS PAGE
           ============================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            background: radial-gradient(circle at top right, #4a0002, #121414 60%),
                        radial-gradient(circle at bottom left, #1a0001, #121414 80%);
            min-height: 100vh;
            color: #e2e2e2;
        }
        
        /* Glass Card Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .glass-card:hover {
            border-color: rgba(220, 38, 38, 0.4);
            transform: translateY(-2px);
        }
        
        /* Donor List Container - Scrollbar only for donor cards */
        .donor-list-container {
            max-height: calc(100vh - 280px);
            overflow-y: auto;
            padding-right: 4px;
        }
        
        /* Custom Scrollbar for Donor List */
        .donor-list-container::-webkit-scrollbar {
            width: 4px;
        }
        
        .donor-list-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        
        .donor-list-container::-webkit-scrollbar-thumb {
            background: #dc2626;
            border-radius: 10px;
        }
        
        .donor-list-container::-webkit-scrollbar-thumb:hover {
            background: #ffb4ab;
        }
        
        /* Filters Scroll Container - Horizontal scroll for blood group chips */
        .filters-scroll-container {
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            padding-bottom: 8px;
        }
        
        .filters-scroll-container::-webkit-scrollbar {
            height: 3px;
        }
        
        .filters-scroll-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .filters-scroll-container::-webkit-scrollbar-thumb {
            background: #dc2626;
            border-radius: 10px;
        }
        
        /* Filter Chips - SMALLER SIZE with RED active color */
        .filter-chip {
            display: inline-flex;
            white-space: nowrap;
            margin-right: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 12px !important;
            padding: 5px 14px !important;
            border-radius: 9999px;
            font-weight: 500;
        }
        
        .filter-chip:active {
            transform: scale(0.95);
        }
        
        /* Active Filter Chip - RED color */
        .filter-chip-active {
            background: #dc2626 !important;
            color: white !important;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.3);
            border: none;
        }
        
        /* Inactive Filter Chip */
        .filter-chip-inactive {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e6bdb8;
        }
        
        .filter-chip-inactive:hover {
            border-color: #dc2626;
            color: #dc2626;
        }
        
        /* Blood Type Badge */
        .blood-badge {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.2), 0 4px 12px rgba(220,38,38,0.3);
        }
        
        /* Material Icons */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Text Colors */
        .text-primary {
            color: #ffb4ab;
        }
        
        .text-on-surface {
            color: #e2e2e2;
        }
        
        .text-on-surface-variant {
            color: #e6bdb8;
        }
        
        /* Background Colors */
        .bg-surface\/80 {
            background-color: rgba(18, 20, 20, 0.8);
        }
        
        .bg-surface-container-lowest {
            background-color: #0c0f0f;
        }
        
        /* Typography */
        .label-sm {
            font-size: 12px;
            font-weight: 500;
            line-height: 16px;
            letter-spacing: 0.05em;
        }
        
        .headline-md {
            font-size: 24px;
            font-weight: 600;
            line-height: 32px;
        }
        
        /* Pulse Animation */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        /* Donor Card Styles */
        .donor-card {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .donor-card:active {
            transform: scale(0.98);
        }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 50;
            background: rgba(18, 20, 20, 0.8);
            backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 80px;
            padding-left: 1rem;
            padding-right: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        }

            background-color: rgba(220, 38, 38, 0.2);

        .truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

    </style>

        }

        // Filter logic
        let currentFilter = 'All';

        function filterDonors() {
            let filtered = donors;
            if (currentFilter !== 'All') {
                filtered = filtered.filter(d => d.bloodType === currentFilter);
            }
            renderDonors(filtered);
        }

        // Filter chip click handlers - RED ACTIVE STYLE
        const filterChips = document.querySelectorAll('.filter-chip');
        
        function updateActiveFilter(activeChip) {
            filterChips.forEach(chip => {
                chip.classList.remove('filter-chip-active');
                chip.classList.add('filter-chip-inactive');
            });
            activeChip.classList.remove('filter-chip-inactive');
            activeChip.classList.add('filter-chip-active');
        }
        
        filterChips.forEach(chip => {
            chip.addEventListener('click', function() {
                updateActiveFilter(this);
                currentFilter = this.getAttribute('data-blood');
                filterDonors();
            });
        });

        // Initial render
        renderDonors(donors);
    </script>
</body>
</html>
